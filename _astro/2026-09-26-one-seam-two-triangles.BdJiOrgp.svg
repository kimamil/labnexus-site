<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">One seam, two triangles</title>
  <desc id="d">Left: the contract's triangle, scope fixed, time and cost estimated. Right: the program's triangle, time and cost fixed, scope flexes. Between them a seam where changes become priced change requests and hopes replace agreements.</desc>
  <defs>
    <style>
      text { font-family: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d3854; }
      .h { font-size: 26px; font-weight: 700; }
      .l { font-size: 20px; font-weight: 600; }
      .s { font-size: 19px; fill: rgba(29,56,84,0.7); }
      .m { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; fill: rgba(29,56,84,0.48); text-transform: uppercase; }
      .g { fill: #8f6410; }
      .tri { fill: none; stroke: #1d3854; stroke-width: 3; stroke-linejoin: round; }
      .fixed { fill: #1d3854; }
      .est { fill: #faf7f1; stroke: #1d3854; stroke-width: 3; }
      .seam { stroke: #e2a944; stroke-width: 3; stroke-dasharray: 10 8; }
    </style>
  </defs>

  <!-- left: the contract -->
  <text x="60" y="62" class="m">What the contract fixes</text>
  <text x="60" y="100" class="h">Priced per release</text>
  <text x="60" y="130" class="s">scope fixed · time and cost estimated</text>
  <polygon class="tri" points="290,190 120,470 460,470"/>
  <circle class="fixed" cx="290" cy="190" r="16"/>
  <text x="290" y="172" class="l" text-anchor="middle">Scope</text>
  <circle class="est" cx="120" cy="470" r="16"/>
  <text x="120" y="512" class="l" text-anchor="middle">Time</text>
  <circle class="est" cx="460" cy="470" r="16"/>
  <text x="460" y="512" class="l" text-anchor="middle">Cost</text>
  <text x="290" y="580" class="s" text-anchor="middle">The vendor's world: every change is a change request with a price.</text>

  <!-- seam -->
  <line class="seam" x1="600" y1="150" x2="600" y2="395"/>
  <line class="seam" x1="600" y1="462" x2="600" y2="540"/>
  <text x="600" y="62" class="m" text-anchor="middle">The seam</text>
  <rect x="470" y="252" width="260" height="40" rx="20" fill="#faf7f1" stroke="#e2a944" stroke-width="2"/>
  <text x="600" y="279" class="l g" text-anchor="middle" font-size="18">"we fix what we break"</text>
  <rect x="470" y="332" width="260" height="40" rx="20" fill="#faf7f1" stroke="#e2a944" stroke-width="2"/>
  <text x="600" y="359" class="l g" text-anchor="middle" font-size="18">"who pays for rework?"</text>
  <text x="600" y="422" class="s" text-anchor="middle" font-size="16">a hope on one side,</text>
  <text x="600" y="446" class="s" text-anchor="middle" font-size="16">an open question on the other</text>

  <!-- right: the program -->
  <text x="1140" y="62" class="m" text-anchor="end">What the program fixes</text>
  <text x="1140" y="100" class="h" text-anchor="end">Runs in cadences</text>
  <text x="1140" y="130" class="s" text-anchor="end">time and cost fixed · scope flexes</text>
  <polygon class="tri" points="910,190 740,470 1080,470"/>
  <circle class="est" cx="910" cy="190" r="16"/>
  <text x="910" y="172" class="l" text-anchor="middle">Scope</text>
  <circle class="fixed" cx="740" cy="470" r="16"/>
  <text x="740" y="512" class="l" text-anchor="middle">Time</text>
  <circle class="fixed" cx="1080" cy="470" r="16"/>
  <text x="1080" y="512" class="l" text-anchor="middle">Cost</text>
  <text x="910" y="580" class="s" text-anchor="middle">The program's world: re-prioritising the backlog is normal work.</text>

  <!-- legend -->
  <circle class="fixed" cx="70" cy="606" r="8"/><text x="86" y="611" class="s" font-size="14">fixed</text>
  <circle class="est" cx="150" cy="606" r="8"/><text x="166" y="611" class="s" font-size="14">estimated or flexible</text>
</svg>
